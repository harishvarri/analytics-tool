version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      next-stack:
        patterns: ['next', 'eslint-config-next', '@next/*', 'react', 'react-dom']
      supabase:
        patterns: ['@supabase/*']
      ui:
        patterns: ['@radix-ui/*', 'lucide-react', 'tailwindcss', 'tailwind-merge', 'recharts']
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
