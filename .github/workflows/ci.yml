name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      # Placeholder envs so the Zod env schema doesn't throw at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      INGEST_API_KEY: placeholder-ingest-key-1234567890abcdef
      IP_HASH_SALT: placeholder-salt
      CRON_SECRET: placeholder-cron-secret-1234567890ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # The web app imports @ncpl/analytics-sdk from its built dist/, so the SDK
      # MUST be built before lint/typecheck/build can resolve its types.
      - name: Build SDK
        run: npm run sdk:build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build web app
        run: npm run build -w apps/web
