name: Refresh analytics aggregates

on:
  schedule:
    # Every 15 minutes — keeps dashboard materialized views fresh.
    # (Moved off Vercel Cron, whose Hobby plan only allows daily.)
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-analytics-aggregates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh materialized views
        env:
          ANALYTICS_APP_URL: ${{ secrets.ANALYTICS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$ANALYTICS_APP_URL" || { echo "::error::ANALYTICS_APP_URL secret is not set in repo Settings → Secrets → Actions"; exit 1; }
          test -n "$CRON_SECRET"       || { echo "::error::CRON_SECRET secret is not set in repo Settings → Secrets → Actions"; exit 1; }

          # Body → file, status → stdout. -sS = quiet but surface real errors.
          http=$(curl -sS --retry 2 --max-time 60 \
            -o /tmp/resp.txt -w '%{http_code}' \
            -H "x-cron-secret: $CRON_SECRET" \
            "$ANALYTICS_APP_URL/api/v1/admin/refresh-aggregates")
          echo "HTTP $http"; echo "Body: $(cat /tmp/resp.txt 2>/dev/null)"
          if [ "$http" = "401" ]; then
            echo "::error::401 Unauthorized — the CRON_SECRET in GitHub does not match the CRON_SECRET in Vercel."
            exit 1
          fi
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::refresh-aggregates returned HTTP $http"; exit 1
          fi

      - name: Ensure event partitions
        env:
          ANALYTICS_APP_URL: ${{ secrets.ANALYTICS_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$ANALYTICS_APP_URL" || { echo "::error::ANALYTICS_APP_URL secret not set"; exit 1; }
          test -n "$CRON_SECRET"       || { echo "::error::CRON_SECRET secret not set"; exit 1; }

          http=$(curl -sS --retry 2 --max-time 60 \
            -o /tmp/resp.txt -w '%{http_code}' \
            -H "x-cron-secret: $CRON_SECRET" \
            "$ANALYTICS_APP_URL/api/v1/admin/ensure-partitions")
          echo "HTTP $http"; echo "Body: $(cat /tmp/resp.txt 2>/dev/null)"
          if [ "$http" -lt 200 ] || [ "$http" -ge 300 ]; then
            echo "::error::ensure-partitions returned HTTP $http"; exit 1
          fi
